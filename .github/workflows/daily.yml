name: IPTV Daily Update

# 免费自动定时运行方案（GitHub 单一平台，已移除 Gitee）
# - 公开仓库：GitHub Actions 完全免费、无限分钟
# - 原生 cron：每天北京时间 00:00（= UTC 前一天 16:00）自动跑一次
# - 自带 GITHUB_TOKEN：发现层直接享受搜索配额，无需额外申请
# - 产物落本仓库 main 分支
# - 同时发布一个 GitHub Release（tag=latest），订阅走 releases/latest/download/iptv.m3u
#   该地址走 GitHub 发行 CDN，无 jsDelivr @main 浮动缓存延迟，国内也稳
# - jsDelivr 作为备用（@main 浮动标签在部分国内节点缓存难清，可能滞后，勿作首选）
#
# 前置（一次性，已配好，无需再动）：
#   （GITEE_PAT 已删除——本项目只走 GitHub，不再依赖 Gitee）
#   GITHUB_TOKEN 由 GitHub 自动提供，发现层搜索配额即用。

on:
  schedule:
    # 北京时间 00:00 = UTC 前一天 16:00
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点 "Run workflow" 立即跑

permissions:
  contents: write   # 需要回写 output/ 到本仓库（供 jsDelivr / raw.githubusercontent 订阅）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (ubuntu 镜像默认无，验证层必需)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pipeline (discover→retire→fetch→dedup→validate→generate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 自带：发现层搜索配额
        run: bash scripts/run_all.sh                  # 全量验证（不再限 300 条）

      - name: Commit playlist back to GitHub (jsDelivr / raw 源)
        if: always()
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@local"
          git add output/iptv.m3u output/iptv.txt \
                  sources/registry.json sources/graveyard.json
          git diff --cached --quiet || git commit -m "chore: update playlist $(date -u +%FT%TZ)"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nmww/iptv-hunter.git" HEAD:main

      - name: Publish release latest (GitHub 发行 CDN，国内稳、无浮动缓存延迟)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          gh release create latest output/iptv.m3u output/iptv.txt \
            --title "最新直播源 $(date -u +%FT%TZ)" \
            --notes "自动更新。VLC 订阅：https://github.com/nmww/iptv-hunter/releases/latest/download/iptv.m3u" || true

      - name: Purge jsDelivr cache (备用地址，尽量刷新)
        if: always()
        run: |
          curl -s -m 30 "https://purge.jsdelivr.net/gh/nmww/iptv-hunter@main/output/iptv.m3u" || true
          curl -s -m 30 "https://purge.jsdelivr.net/gh/nmww/iptv-hunter@main/output/iptv.txt" || true
