# iptv-hunter 全局配置
# 注意：本文件只放非机密的调度参数。任何令牌（GITHUB_TOKEN / GITEE_PUSH_TOKEN）
# 一律通过「环境变量」或「Gitee Go 流水线密钥」注入，绝不写进本文件或提交仓库。

[discover]
# 读取哪个环境变量作为 GitHub 令牌；为空则匿名（60 次/小时，仅适合试跑）
github_token_env = GITHUB_TOKEN
# 单日新增仓库上限（防 API 限流）
max_new_repos_per_day = 50
# 每个查询词最多抓取的页数（每页 100 个仓库）
max_pages_per_query = 5
# 单次 HTTP 请求超时（秒）
request_timeout = 15
# 单次请求失败重试次数
request_retries = 2

[fetch]
# 单源下载超时（秒）
timeout = 10
retries = 2

[dedup]
# 同一频道（归一化后）最终保留的最快 URL 条数
same_channel_keep = 3

[validate]
# 流级验证并发线程数
workers = 20
# 第一层 HTTP 探测超时（秒）
layer1_timeout = 5
# 第三层 ffmpeg 真实播放探测时长（秒）
verify_seconds = 5
# 单次运行最多验证多少条流（0=不限）。CI 免费额度有限时建议设小值（如 200），避免超时
max_streams = 0

[retire]
# 连续验证失败达到该次数 → 移入墓地
consecutive_failures_threshold = 7
# 墓地源每隔多少天自动回访复检
graveyard_revisit_days = 30
# 仓库超过多少天无 push → 不再纳入发现准入
repo_stale_days = 90

[output]
# EPG 节目单地址（嵌入 m3u 头部）
epg_url = https://epg.pw/api/epg.xml
# 频道分组（逗号分隔，用于归类与展示）
groups = 央视,卫视,国际,体育,纪录,少儿
# 时区（用于时间戳标注）
timezone = Asia/Shanghai
